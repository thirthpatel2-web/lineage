# Render Blueprint: Dashboard > New > Blueprint > pick this repo.
# Creates the web app, a Postgres database and a weekly royalty payout job.
services:
  - type: web
    name: lineage
    runtime: node
    # CLIP + ONNX Runtime need more than 512 MB; Standard (2 GB) is comfortable.
    plan: standard
    # Render sets NODE_ENV=production, so dev tools (TypeScript, Tailwind) must be asked for.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: lineage-db
          property: connectionString
      - key: SEED_DEMO
        value: "1"
      - key: APP_URL
        sync: false # e.g. https://lineage.onrender.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_MERCHANT_EMAIL
        sync: false
      - key: DEMO_PAYEE_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: AG_STUDIO
        sync: false
      - key: AI_DAILY_LIMIT
        value: "500"
      - key: PLATFORM_FEE_BP
        value: "1000"

  - type: cron
    name: lineage-weekly-payouts
    runtime: node
    plan: starter
    schedule: "0 9 * * MON"
    buildCommand: "true"
    startCommand: curl -fsS -X POST "$APP_URL/api/payouts/run"
    envVars:
      - key: APP_URL
        sync: false

databases:
  - name: lineage-db
    plan: basic-256mb
